<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشروعي · شاشة العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0F4C3A;overflow:hidden}
body{font-family:'Readex Pro',sans-serif;color:#111827}
body.idle{cursor:none}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;background:#F3F7F5;display:flex;flex-direction:column;overflow:hidden}
p,h1,h2{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate}
header{height:96px;flex-shrink:0;background:#0F4C3A;color:#fff;display:flex;align-items:center;gap:20px;padding:0 36px;border-radius:0 0 28px 28px}
header img{width:52px;height:52px;border-radius:14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:24px;line-height:32px;font-weight:700}
.brand span{font-size:18px;line-height:24px;color:#D1FAE5;white-space:nowrap}
.vsep{width:1px;height:48px;background:rgba(255,255,255,.2);flex-shrink:0}
header h1{flex:1;min-width:0;font-size:30px;line-height:40px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 16px;background:rgba(255,255,255,.14);font-size:20px;line-height:1.5;font-weight:500;white-space:nowrap}
.sync i{width:12px;height:12px;border-radius:12px;background:#86EFAC;box-shadow:0 0 0 3px rgba(134,239,172,.25)}
.sync.off i{background:#FBBF24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.clock{font-size:30px;font-weight:600}
main{flex:1;min-height:0;display:flex;gap:28px;padding:28px 36px 32px}
.card{background:#fff;border-radius:28px;box-shadow:0 1px 3px rgba(17,24,39,.08)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;white-space:nowrap;font-weight:600}
.emb{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emb svg{width:36px;height:36px}
.fit{overflow:hidden}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#374151;text-align:center}
.empty b{font-size:34px;color:#0F4C3A}
.empty span{font-size:24px}
/* الاقتران */
.pair{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;padding:40px 48px}
.pair .codebox{display:flex;gap:16px;direction:ltr}
.pair .codebox span{width:96px;height:132px;border:3px solid #155E4B;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:700;color:#0F4C3A}
.steps{display:flex;flex-direction:column;gap:22px}
.step{display:flex;align-items:center;gap:18px;font-size:26px;line-height:36px}
.step i{font-style:normal;width:56px;height:56px;border-radius:28px;background:#155E4B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;flex-shrink:0}
#fs{position:fixed;left:20px;bottom:20px;z-index:5;border:0;border-radius:14px;background:rgba(15,76,58,.92);color:#fff;font:600 16px 'Readex Pro',sans-serif;padding:12px 18px;cursor:pointer;transition:opacity .3s}
body.idle #fs{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){#stage.swap main{animation:fade .35s ease-out}}
@keyframes fade{from{opacity:.3}to{opacity:1}}
</style>
</head>

          ltr(signed(p.prize_ds) + ' Ds')) : null));
  });
  const out = [headerFor(st), h('main', {style: 'flex-direction:column;gap:22px'},
    h('div', {cls: 'card', style: 'display:flex;align-items:center;gap:24px;padding:22px 32px'},

        h('span', {cls: 'pill', style: 'align-self:flex-start;background:#EDE9FE;color:#5B21B6;font-size:18px;padding:2px 14px;font-weight:500'}, 'معرض الابتكار · ' + kindLabel),

        ps[0].need ? h('span', {style: 'font-size:22px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'}, 'الاحتياج: ' + ps[0].need) : null)),
    h('div', {style: 'flex:1;min-height:0;display:flex;gap:18px'}, cards))];
  out.fits = fits; out.sameSize = true;
  return out;
}

function viewClassCode(st) {

// ---------- الرسم ----------
let lastKey = '', lastView = '';
function render(st) {
  const key = JSON.stringify(Object.assign({}, st, {now: null}));
  if (key === lastKey) { updateSync(); return; }
  lastKey = key;
  let nodes;
  if (st.status === 'waiting_pair') nodes = viewPairing(st.code);
  else {
    emblemColors(st.companies);
    nodes = ({waiting: viewWaiting, answer: viewAnswer, race: viewRace, innovation: viewInnovation, class_code: viewClassCode}[st.view] || viewRace)(st);
  }
  const view = st.status === 'waiting_pair' ? 'pair' : st.view;
  $stage.replaceChildren(...nodes);
  $stage.classList.toggle('swap', view !== lastView);
  lastView = view;
  const doFit = () => {
    const fs = (nodes.fits || []).filter(Boolean);
    fs.forEach(f => fitText(f[0], f[1], f[2]));
    if (nodes.sameSize && fs.length) {
      const m = Math.min(...fs.map(f => parseFloat(f[0].style.fontSize)));
      fs.forEach(f => { f[0].style.fontSize = m + 'px'; });
    }
  };
  doFit(); updateSync();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(doFit);
}

// ---------- التحجيم وملء الشاشة ----------
function scale() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  $stage.style.transform = `translate(${(innerWidth - 1280 * s) / 2}px, ${(innerHeight - 720 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', scale); scale();
const fsBtn = document.getElementById('fs');
fsBtn.addEventListener('click', () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); });
let idleTimer;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 5000); }
addEventListener('mousemove', wake); addEventListener('keydown', wake); wake();
document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'خروج من ملء الشاشة' : 'ملء الشاشة'; });

// ---------- الاتصال ----------
let lastOk = 0, inFlight = false, code = null;
function getToken() {
  const K = 'mashroui_display_token';
  try { const t = localStorage.getItem(K); if (t && t.length >= 64) return t; } catch (_) {}
  const b = new Uint8Array(32); crypto.getRandomValues(b);
  const t = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem(K, t); } catch (_) {}
  return t;
}
const TOKEN = getToken();
async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST', cache: 'no-store',
    headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify(args)});
  if (!r.ok) throw new Error(fn + ' ' + r.status);
  return r.json();
}
async function tick() {
  if (inFlight) return; inFlight = true;
  try {
    if (!code) code = await rpc('display_register', {p_token: TOKEN});
    let st = await rpc('display_state', {p_token: TOKEN});
    if (st.status === 'expired') { code = await rpc('display_register', {p_token: TOKEN}); st = {status: 'waiting_pair', code}; }
    lastOk = Date.now();
    render(st);
  } catch (e) {
    console.warn('display', e.message);
    if (!lastKey) render({status: 'waiting_pair', code: '------'});
    updateSync();
  } finally { inFlight = false; }
}
